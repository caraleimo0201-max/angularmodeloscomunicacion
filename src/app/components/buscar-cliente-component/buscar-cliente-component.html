<h1>Buscar cliente Json</h1>
<form #form="ngForm">
    Seleccione un buscarCliente
    <select name= "cajaid" #cajaid>
        @for (cli of arrayclientes; track cli) {
            <option value="{{cli.idcliente}}">
                {{cli.nombre}}
            </option>
        }

    </select>
<button (click)="buscarCliente()">
    Buscar cliente

</button>

</form>
@if (cliente) {
    <h1 style="color: blue;">
        nombre: {{cliente.nombre}}
    </h1>
    <p>{{cliente.paginaweb}}</p>
    <img src="{{cliente.imagencliente}}"
    style="width: 100px; height: 150px;">
}
